<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IZI</title>
<meta name="theme-color" content="#E8EBF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1130" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IZI">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='128' fill='%232F45E0'/%3E%3Cpath d='M152 176H336L168 336H296' fill='none' stroke='%23fff' stroke-width='64' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='368' cy='336' r='40' fill='%23F2A31B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
:root{
  --desk:#E8EBF4; --slip:#FFFFFF; --ink:#1B2250; --muted:#5F6689; --line:#D3D8EA;
  --brand:#2F45E0; --brand-soft:#E3E7FF;
  --way:#F2A31B; --way-soft:#FFF0D1; --way-ink:#6B4500;
  --ok:#11994C; --ok-soft:#DDF4E7; --ok-ink:#0A6B34;
  --no:#D63A3A; --no-soft:#FCE3E3; --no-ink:#A82222;
  --new-soft:#ECEEF6; --new-ink:#4C5374;
  --vio:#7B3FE4; --vio-soft:#EFE7FF; --vio-ink:#5A22B8; --vio-on:#fff;
  --shadow:0 1px 0 rgba(27,34,80,.05),0 8px 20px -14px rgba(27,34,80,.45);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --vio:#A57BFF; --vio-soft:#2E1F55; --vio-ink:#D2BDFF; --vio-on:#1A0B3D;
  --desk:#0D1130; --slip:#171D45; --ink:#EDEFFF; --muted:#A0A6CF; --line:#2B3266;
  --brand:#6474FF; --brand-soft:#232C6B;
  --way-soft:#3A2D10; --way-ink:#FFD27E;
  --ok-soft:#0F3A2A; --ok-ink:#7FE2A9;
  --no-soft:#46181E; --no-ink:#FF9E9E;
  --new-soft:#222955; --new-ink:#BAC0E8;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --vio:#A57BFF; --vio-soft:#2E1F55; --vio-ink:#D2BDFF; --vio-on:#1A0B3D;
  --desk:#0D1130; --slip:#171D45; --ink:#EDEFFF; --muted:#A0A6CF; --line:#2B3266;
  --brand:#6474FF; --brand-soft:#232C6B;
  --way-soft:#3A2D10; --way-ink:#FFD27E;
  --ok-soft:#0F3A2A; --ok-ink:#7FE2A9;
  --no-soft:#46181E; --no-ink:#FF9E9E;
  --new-soft:#222955; --new-ink:#BAC0E8;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
button,a,.orow,.chip{touch-action:manipulation}
body{margin:0;min-height:100vh;font-family:Rubik,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45;color:var(--ink);background:var(--desk);-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:var(--desk);background:color-mix(in srgb,var(--desk) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top-in{max-width:680px;height:60px;margin:0 auto;padding:0 10px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.top-in.wide{max-width:1080px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand .mark{width:30px;height:30px}
.role{font-size:13px;font-weight:700;letter-spacing:0;color:var(--muted);padding:2px 8px;border:1.5px solid var(--line);border-radius:8px}
.top-r{display:flex;align-items:center;gap:4px}
.icon-btn{position:relative;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--ink);display:grid;place-items:center}
.icon-btn:hover{background:var(--new-soft)}
.badge{position:absolute;top:3px;right:1px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--no);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center}
.code{font-weight:800;font-size:16px;letter-spacing:.03em;padding:5px 10px;border-radius:10px;background:var(--ink);color:var(--slip);white-space:nowrap}
.code.sm{font-size:14px;padding:3px 8px;border-radius:8px}
.live{display:inline-flex;align-items:center;gap:6px;padding:0 6px;font-size:13px;font-weight:700;color:var(--no-ink)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.live.off i{background:var(--no);box-shadow:none}
.demo{border:1.5px dashed var(--brand);background:transparent;color:var(--brand);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.banner{display:flex;align-items:center;gap:10px;width:calc(100% - 28px);max-width:1052px;margin:4px auto 0;padding:12px 14px;border:0;border-radius:14px;background:var(--way-soft);color:var(--way-ink);font-weight:700;text-align:left}

/* ---------- layout ---------- */
.wrap{max-width:680px;margin:0 auto;padding:8px 14px calc(40px + env(safe-area-inset-bottom))}
.wrap.wide{max-width:1080px;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.h2{font-size:17px;font-weight:800;margin:0 0 10px}
.h3{font-size:15px;font-weight:800;margin:20px 0 8px}
.hint{margin:0;font-size:14px;color:var(--muted)}

/* ---------- receipt lines ---------- */
.receipt{background:var(--slip);border-radius:18px;padding:10px 16px;box-shadow:var(--shadow);margin:4px 0 16px}
.rline{display:flex;align-items:baseline;gap:8px;padding:5px 0}
.rline .lead{flex:1;min-width:12px;border-bottom:2px dotted var(--line);transform:translateY(-5px)}
.rline b{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.rline.big b{font-size:21px;letter-spacing:-.01em}

/* ---------- tabs ---------- */
.seg{display:flex;gap:4px;padding:4px;margin-bottom:14px;border-radius:14px;background:var(--new-soft)}
.seg button{flex:1;min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-selected=true]{background:var(--slip);color:var(--ink);box-shadow:var(--shadow)}
.seg em{font-style:normal;font-size:13px;min-width:24px;padding:1px 7px;border-radius:999px;background:var(--desk)}

/* ---------- the slip ---------- */
.slip{position:relative;overflow:hidden;background:var(--slip);border-radius:18px;padding:14px 16px 16px 20px;box-shadow:var(--shadow)}
/* Kuryer bir qarashda holatni rangidan bilib oladi:
   koʻk — yangi buyurtma, sariq — yoʻlda, yashil — topshirildi, qizil — bekor qilindi. */
.slip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--brand)}
.slip[data-st=on_way]::before{background:var(--way)}
.slip[data-st=delivered]::before{background:var(--ok)}
.slip[data-st=cancelled]::before{background:var(--no)}
.slip[data-st=assigned] .ono{color:var(--brand)}
.slip[data-st=on_way] .ono{color:var(--way-ink)}
.slip[data-st=delivered] .amount{color:var(--ok-ink)}
.slip+.slip{margin-top:14px}
.slip.flat{box-shadow:none;border:1.5px solid var(--line)}
.slip-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ono{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.amount{margin-top:8px;font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.amount small{margin-left:6px;font-size:17px;font-weight:700;letter-spacing:0;color:var(--muted)}
.amount .paid{font-size:21px;letter-spacing:-.01em;color:var(--ok-ink)}
.amount .paid.unk{color:var(--muted)}
.cust{margin-top:10px;font-size:19px;font-weight:700;overflow-wrap:anywhere}
.row{display:flex;align-items:flex-start;gap:10px;margin-top:10px}
.row>.i{margin-top:2px;color:var(--muted)}
.row .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.sub{margin-top:2px;font-size:15px;color:var(--muted)}
.tel{font-weight:500;text-decoration:none;font-variant-numeric:tabular-nums}
.phones .txt{display:grid;gap:8px;min-width:0}
.ph-hint{font-size:13px;font-weight:600;color:var(--muted)}
.ph-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.ph{min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--slip);color:var(--ink);font:inherit;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.ph[aria-checked=true]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.btn.btn-call{width:100%;min-height:48px;background:var(--ok);color:#fff}
.btn.btn-call.off{background:var(--new-soft);color:var(--muted);cursor:default}
.btn-call svg.i{width:19px;height:19px}
.mini{flex:none;align-self:center;padding:8px 12px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-size:14px;font-weight:700;text-decoration:none}
.qty{font-weight:700;white-space:nowrap}
.perf{position:relative;margin:16px -16px 14px;border-top:2px dashed var(--line)}
.perf::before,.perf::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--desk)}
.perf::before{left:-9px}.perf::after{right:-9px}
.slip.flat .perf::before,.slip.flat .perf::after{display:none}
.onway{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:700;color:var(--way-ink)}
.outcome b{display:block}
.outcome p{margin:4px 0 0;color:var(--muted)}
.slip.is-final .amount,.slip.is-final .cust{opacity:.8}
.slip .tel{color:var(--brand);font-weight:700}

/* rubber stamp: the one loud moment */
.stamp{position:absolute;top:22px;right:16px;display:flex;flex-direction:column;align-items:center;padding:6px 14px 5px;border:3px solid currentColor;border-radius:12px;font-size:21px;font-weight:800;line-height:1.1;transform:rotate(-9deg);box-shadow:0 0 0 3px var(--slip),0 0 0 5.5px currentColor;background:var(--slip);background:color-mix(in srgb,var(--slip) 55%,transparent);pointer-events:none}
.stamp small{font-size:12px;font-weight:700;letter-spacing:.04em}
.stamp.ok{color:var(--ok)}.stamp.no{color:var(--no)}
.stamp.land{animation:stamp .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{0%{transform:rotate(-22deg) scale(2.2);opacity:0}55%{opacity:1}100%{transform:rotate(-9deg) scale(1);opacity:1}}

/* ---------- status chips ---------- */
.st{padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.st-new{background:var(--new-soft);color:var(--new-ink)}
.st-asg{background:var(--brand-soft);color:var(--brand)}
.st-way{background:var(--way-soft);color:var(--way-ink)}
.st-ok{background:var(--ok-soft);color:var(--ok-ink)}
.st-no{background:var(--no-soft);color:var(--no-ink)}

/* ---------- buttons ---------- */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:0 18px;border:0;border-radius:14px;background:var(--new-soft);color:var(--ink);font-size:17px;font-weight:700;line-height:1.15;text-align:center;text-decoration:none;transition:transform .08s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-go{background:var(--brand);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-no{background:transparent;color:var(--no-ink);box-shadow:inset 0 0 0 2px var(--no)}
.btn-no-solid{background:var(--no);color:#fff}
.btn-ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-block{display:flex;width:100%}
.btn-block+.btn-block{margin-top:10px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn-col{display:grid;gap:10px;margin-top:14px}
.link-btn{border:0;background:none;padding:8px 4px;color:var(--brand);font-weight:700}
.link-btn.danger{color:var(--no-ink)}

/* ---------- admin: orders ---------- */
.toolbar{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:4px 0 12px}
.toolbar .btn{min-height:50px;padding:0 12px;font-size:15px}
.fchips{display:flex;gap:6px;overflow-x:auto;margin:0 -14px;padding:0 14px 4px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:8px;padding:8px 12px 8px 14px;border:0;border-radius:999px;background:var(--slip);color:var(--ink);font-size:15px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line)}
.fchip em{font-style:normal;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.fchip[aria-selected=true]{background:var(--ink);color:var(--slip);box-shadow:none}
.fchip[aria-selected=true] em{color:inherit;opacity:.75}
.fline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 0}
.fline .search{grid-column:1/-1}
.fline select{min-height:44px;padding:0 4px 0 10px;font-size:14px}
@media (max-width:400px){.fline select{font-size:13px}}
@media (min-width:720px){.fline{grid-template-columns:1fr 200px 170px 150px}.fline .search{grid-column:auto}}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;background:var(--slip);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.search input{flex:1;min-width:0;min-height:46px;border:0;outline:0;background:transparent;color:var(--ink)}
select,.fld input,.fld textarea{width:100%;min-height:46px;padding:0 12px;border:0;border-radius:12px;background:var(--slip);box-shadow:inset 0 0 0 1.5px var(--line)}
.fld textarea{min-height:84px;padding:10px 12px;resize:vertical}
select:focus,.fld input:focus,.fld textarea:focus,.search:focus-within{outline:0;box-shadow:inset 0 0 0 2px var(--brand)}
.list-head{display:flex;align-items:center;gap:10px;margin:14px 0 8px;font-size:14px;font-weight:600;color:var(--muted)}
.list-head>span{margin-right:auto}
.olist{display:grid;gap:8px}
@media (min-width:900px){.olist{grid-template-columns:1fr 1fr}}
.orow{--bar:var(--new-ink);position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-radius:14px;background:var(--slip);box-shadow:var(--shadow);cursor:pointer}
.orow[data-st=assigned]{--bar:var(--brand)}.orow[data-st=on_way]{--bar:var(--way)}.orow[data-st=delivered]{--bar:var(--ok)}.orow[data-st=cancelled]{--bar:var(--no)}
.orow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bar)}
.orow.sel{box-shadow:inset 0 0 0 2px var(--brand),var(--shadow)}
/* skladda mahsulot yetmaydi: binafsha fon, chiziqli belgi */
.orow.short{background:var(--vio-soft)}
.orow.short::before{width:6px;background:repeating-linear-gradient(135deg,var(--vio) 0 5px,transparent 5px 9px)}
.orow-short{display:flex;align-items:flex-start;gap:6px;margin-top:6px;font-size:13px;font-weight:700;color:var(--vio-ink);line-height:1.35}
.orow-short svg.i{width:16px;height:16px;margin-top:1px}
.shortbar{display:flex;align-items:center;gap:12px;width:100%;margin:10px 0 0;padding:11px 14px;border:0;border-radius:14px;background:var(--vio-soft);color:var(--vio-ink);text-align:left;box-shadow:inset 0 0 0 1.5px var(--vio)}
.shortbar[aria-pressed=true]{background:var(--vio);color:var(--vio-on)}
.shortbar>span{display:grid;gap:1px}
.shortbar small{font-size:13px;font-weight:600;opacity:.85}
.warnbox.v{display:flex;gap:10px;align-items:flex-start;background:var(--vio-soft);color:var(--vio-ink)}
.orow-main{flex:1;min-width:0}
.orow-l1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.orow-l1 .nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:700}
.orow-l1 .am{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.orow-l2{margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px;color:var(--muted)}
.orow-l3{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.orow-l3 .pr{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px}
.orow-st{flex:none;display:flex;align-items:center;gap:6px}
.orow-st time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cc{padding:3px 8px;border-radius:8px;background:var(--ink);color:var(--slip);font-size:13px;font-weight:800}
.co{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:7px;background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:700;vertical-align:1px;overflow:hidden;text-overflow:ellipsis}
.warn{padding:3px 8px;border-radius:8px;background:var(--way-soft);color:var(--way-ink);font-size:13px;font-weight:700}
.cbox{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line)}
.orow.sel .cbox{background:var(--brand);color:#fff;box-shadow:none}
.more{margin-top:12px}
.hide-s{display:none}
@media (min-width:520px){.hide-s{display:inline}}
.selbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:25;padding:0 10px}
.selbar-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 6px 8px 16px;border-radius:16px;background:var(--ink);color:var(--slip);box-shadow:0 12px 30px -12px rgba(13,17,48,.7)}
.selbar-in>span{flex:1}
.selbar .btn{min-height:44px;padding:0 14px;font-size:15px}
.selbar .icon-btn{color:var(--slip)}
.selbar .icon-btn:hover{background:transparent}

/* ---------- admin: bottom nav ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:24;padding-bottom:env(safe-area-inset-bottom);background:var(--slip);box-shadow:0 -1px 0 var(--line)}
.bnav-in{max-width:680px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.bnav button{position:relative;min-width:0;min-height:64px;padding:0 2px;border:0;background:none;color:var(--muted);font-size:10px;letter-spacing:-.01em;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
@media (max-width:359px){.bnav button{font-size:9px}}
.bnav button[aria-current=page]{color:var(--brand)}
.bnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.bnav .dot{position:absolute;top:11px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;background:var(--no)}

/* ---------- admin: couriers ---------- */
.cgroup+.cgroup{margin-top:20px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ctile{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:0;border-radius:16px;background:var(--slip);box-shadow:var(--shadow);text-align:left}
.ctile.off{opacity:.55}
.ctile-code{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.ctile-stats{display:flex;flex-direction:column;font-size:14px;color:var(--muted)}
.ctile-stats b{color:var(--ink)}
.ctile-stats .ok b{color:var(--ok-ink)}.ctile-stats .no b{color:var(--no-ink)}
.ctile-sum{font-weight:800;font-variant-numeric:tabular-nums}
.ctile-sum small{font-weight:700;color:var(--muted)}

/* ---------- admin: alerts ---------- */
.alist{display:grid;gap:8px}

.cpick-r{display:block;margin-bottom:6px;font-size:14px;font-weight:700;color:var(--muted)}

.timeline{display:grid;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.timeline li{display:flex;gap:10px;font-size:15px}
.timeline time{flex:none;width:92px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- toasts ---------- */
#toasts{position:fixed;top:calc(8px + env(safe-area-inset-top));left:0;right:0;z-index:80;display:grid;justify-items:center;gap:6px;padding:0 12px;pointer-events:none}

const TOSH_STEMS = ['toshkent', 'tashkent'];
/* Har bir admin oʻz «zonasi» bilan ishlaydi: ADMIN — Buxoro va Qashqadaryo, TOSHKENT — Toshkent shahri va viloyati */
const ZONE_OF = { buxoro: 'main', qashqadaryo: 'main', toshshahar: 'toshkent', toshvil: 'toshkent' };
const ZONE_NAME = { main: 'Buxoro va Qashqadaryo', toshkent: 'Toshkent' };
const myZone = () => (S.sess && S.sess.zone) || 'main';
function stemKey(w) {
  for (const k in REGION_STEMS) if (REGION_STEMS[k].some(st => w.startsWith(st))) return k;
  return TOSH_STEMS.some(st => w.startsWith(st)) ? 'tosh' : '';
}
/* Matndan hudud. Tartib: «X viloyati» (eng ishonchli) → «Toshkent tumani» (viloyatniki) / «Toshkent shahri» →
   birinchi uchragan tuman yoki shahar nomi → yolgʻiz «Toshkent» (shahar deb olinadi). */
function regionOfText(txt) {
  const w = norm(txt).split(' ').filter(Boolean);
  if (!w.length) return '';
  for (let i = 0; i < w.length; i++) {
    const k = stemKey(w[i]), nx = w[i + 1] || '', pv = w[i - 1] || '';
    if (!k) continue;
    if (/^(viloyat|vil$|obl)/.test(nx)) return k === 'tosh' || k === 'toshshahar' ? 'toshvil' : k;
    if (k === 'tosh' && /^(tuman|rayon|r$)/.test(nx)) return 'toshvil';
    if (k === 'tosh' && (/^(shahr|shahar|sh$|gorod|g$)/.test(nx) || /^(g|gor|sh)$/.test(pv))) return 'toshshahar';
  }
  for (const x of w) { const k = stemKey(x); if (k && k !== 'tosh') return k; }
  return w.some(x => stemKey(x) === 'tosh') ? 'toshshahar' : '';
}
function regionKeyOf(o) {
  for (const f of [o.region, o.district, o.address, o.landmark]) { const k = regionOfText(f); if (k) return k; }
  return '';
}
/* Buyurtma qaysi adminga tegishli: hududdan; hudud aniqlanmasa — yuklagan adminniki */
const zoneOfOrder = o => ZONE_OF[regionKeyOf(o)] || myZone();
function regionKeyOfName(name) {
  return regionOfText(name) || norm(name).split(' ').filter(Boolean)[0] || '';
}
function detectRegion(o, keys) {
  const k = regionKeyOf(o);
  if (k && keys.includes(k)) return k;
  /* admin oʻzi qoʻshgan boshqa hududlar (masalan, Samarqand): nomining boshidan */
  for (const f of [o.region, o.district, o.address, o.landmark]) {
    const words = norm(f).split(' ').filter(Boolean);
    for (const key of keys) if (!REGION_STEMS[key] && words.some(w => w.startsWith(key.slice(0, 5)))) return key;
  }
  return '';
}
let rkCache = { users: null, keys: [], labels: {} };
function regionMeta() {
  if (rkCache.users !== S.users) {
    const labels = {};
    for (const u of S.users) if (u.role === 'courier' && u.region) { const k = regionKeyOfName(u.region); if (k && !labels[k]) labels[k] = u.region; }
    rkCache = { users: S.users, keys: Object.keys(labels), labels };
  }
  return rkCache;
}
const regionKeys = () => regionMeta().keys;
const regionLabel = k => regionMeta().labels[k] || k;
const regionOf = o => detectRegion(o, regionKeys());
const districtKey = o => norm(o.district) || norm(o.address).split(' ')[0] || '';

const CO_DEFAULT = [

  { name: 'ACTIMED', products: [] },
  { name: 'STOP DIABET', products: [] },

const cleanProducts = arr => {
  const seen = new Set(), out = [];
  for (const p0 of arr || []) {
    const p = String(nn(p0, '')).trim().replace(/\s+/g, ' ').slice(0, 40), k = norm(p);
    if (p && k && !seen.has(k)) { seen.add(k); out.push(p); }
  }
  return out;
};
const Companies = {
  list() {
    const saved = store.get('izi_companies');
    if (!Array.isArray(saved)) return CO_DEFAULT.map(d => ({ name: d.name, products: [...d.products] }));
    return saved.filter(c => c && c.name).map(c => ({ name: String(c.name), products: cleanProducts(c.products) }));
  },
  save(list) { store.set('izi_companies', list); },
  add(name) {
    const n = String(name || '').trim().replace(/\s+/g, ' ').slice(0, 60);
    if (!n) return { err: 'Kompaniya nomini yozing.' };
    const list = this.list();
    if (list.some(c => norm(c.name) === norm(n))) return { err: 'Bunday kompaniya allaqachon bor.' };
    list.push({ name: n, products: [] });
    this.save(list);
    return { name: n };
  },
  remove(name) { this.save(this.list().filter(c => c.name !== name)); },
  get(name) { return this.list().find(c => c.name === name) || null; },
  products(name) { const c = this.get(name); return c ? c.products : []; },
  setProducts(name, arr) {
    const list = this.list(), c = list.find(x => x.name === name);
    if (!c) return;
    c.products = cleanProducts(arr);
    this.save(list);
  },
  addProducts(name, arr) {
    const have = this.products(name), known = new Set(have.map(norm));
    const add = cleanProducts(arr).filter(p => !known.has(norm(p)));
    if (add.length) this.setProducts(name, [...have, ...add]);
    return add.length;
  },
};
const parseQty = v => { const n = parseFloat(String(nn(v, '')).replace(',', '.').replace(/[^\d.]/g, '')); return isFinite(n) && n > 0 ? Math.min(999, Math.round(n)) : 0; };
const slugOf = s => norm(s).replace(/\s+/g, '-') || 'kompaniya';

/* ---------------- mahsulot va sklad ---------------- */
const pkey = s => String(nn(s, '')).trim().replace(/\s+/g, ' ').toUpperCase();
const stockKey = (co, p) => pkey(co) + '|' + pkey(p);
/* Buyurtmadagi mahsulotlar: [{n:'ABIHAYAT', q:2}]. items boʻlmasa "ABIHAYAT × 2, TRIO × 1" matnidan olinadi.
   Xuddi shu qoida serverdagi izi_items() funksiyasida ham bor. */
function itemsOf(o) {
  if (Array.isArray(o.items) && o.items.length) {
    return o.items.map(x => ({ n: String(nn(x.n, '')).trim(), q: Math.max(0, parseInt(x.q, 10) || 0) })).filter(x => x.n && x.q);
  }
  const s = String(nn(o.product, '')).trim();
  if (!s) return [];
  const parts = s.split(/\s*,\s*/), out = [];
  for (const x of parts) {
    const m = x.match(/^(.*?\S)\s*×\s*(\d+)$/) || x.match(/^(.*?\S)\s+[xX*]\s*(\d+)$/);
    if (m) out.push({ n: m[1].trim(), q: Math.min(999, +m[2]) });
  }
  if (out.length === parts.length) return out;
  return [{ n: s, q: parseQty(o.qty) || 1 }];
}
function needOf(o) {
  const m = new Map();
  for (const it of itemsOf(o)) {
    const k = stockKey(o.company, it.n), x = m.get(k);
    if (x) x.q += it.q; else m.set(k, { n: it.n, q: it.q });
  }
  return m;
}

const ONES = ['', 'bir', 'ikki', 'uch', 'toʻrt', 'besh', 'olti', 'yetti', 'sakkiz', 'toʻqqiz'];
const TENS = ['', 'oʻn', 'yigirma', 'oʻttiz', 'qirq', 'ellik', 'oltmish', 'yetmish', 'sakson', 'toʻqson'];
function tri(n) {
  const h = Math.floor(n / 100), t = Math.floor(n % 100 / 10), o = n % 10, w = [];
  if (h) w.push((h > 1 ? ONES[h] + ' ' : '') + 'yuz');
  if (t) w.push(TENS[t]);
  if (o) w.push(ONES[o]);
  return w.join(' ');
}
function numUz(x) {
  let n = Math.floor(Math.abs(Number(x) || 0));
  if (!n) return 'nol';
  const w = [];
  for (const [v, name] of [[1e9, 'milliard'], [1e6, 'million'], [1e3, 'ming']]) {
    if (n >= v) { const k = Math.floor(n / v); w.push((v === 1e3 && k === 1 ? '' : tri(k) + ' ') + name); n %= v; }
  }
  if (n) w.push(tri(n));
  return w.join(' ').replace(/\s+/g, ' ').trim();
}
const LETTER = { A: 'a', B: 'be', C: 'se', D: 'de', E: 'e', F: 'ef', G: 'ge', H: 'ha', I: 'i', J: 'je', K: 'ka', L: 'el', M: 'em', N: 'en', O: 'o', P: 'pe', Q: 'qe', R: 'er', S: 'es', T: 'te', U: 'u', V: 've', W: 've', X: 'xa', Y: 'ye', Z: 'ze' };
function spellCode(code) {
  const m = String(code || '').match(/^([A-Z]+)-?(\d+)$/);
  const s = m ? m[1].split('').map(ch => LETTER[ch] || ch).join(' ') + ' ' + numUz(+m[2]) : String(code || '').toLowerCase();
  return s ? s[0].toUpperCase() + s.slice(1) : s;
}
const cleanName = s => String(s || '').trim().slice(0, 60).replace(/\S+/g, w => (w === w.toUpperCase() && /[A-ZА-Я]/.test(w)) ? w[0] + w.slice(1).toLowerCase() : w);

/* Rus ovozi oʻzbekcha matnni toʻgʻri oʻqishi uchun: lotin → kirill (talaffuz boʻyicha) */
const RU = { a: 'а', b: 'б', c: 'с', d: 'д', f: 'ф', g: 'г', h: 'х', i: 'и', j: 'дж', k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', q: 'к', r: 'р', s: 'с', t: 'т', u: 'у', v: 'в', w: 'в', x: 'х', z: 'з' };
function toRu(text) {
  const s = String(text).replace(/\d+/g, m => numUz(+m)).toLowerCase().replace(/[ʻʼ‘’`´]/g, "'").replace(/kuryer/g, 'курьер');
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i], n = s[i + 1], n2 = s[i + 2], prev = s[i - 1];
    const start = !prev || !/[a-z'а-яё]/.test(prev);
    if (c === 'y') {
      if (n === 'o' && n2 === "'") { out += 'йу'; i += 2; continue; }
      const y = { o: 'ё', a: 'я', u: 'ю', e: 'е' }[n];
      if (y) { out += y; i++; continue; }
      out += 'й'; continue;
    }
    if (c === 'o' && n === "'") { out += 'у'; i++; continue; }
    if (c === 'g' && n === "'") { out += 'г'; i++; continue; }
    if (c === 's' && n === 'h') { out += 'ш'; i++; continue; }
    if (c === 'c' && n === 'h') { out += 'ч'; i++; continue; }
    if (c === 'e') { out += start ? 'э' : 'е'; continue; }
    if (c === "'") continue;
    out += nn(RU[c], c);
  }
  return out;
}
const latinPlain = t => String(t).replace(/([og])[ʻʼ‘’'`]/gi, '$1');

function evSpeech(ev) {
  const who = spellCode(ev.courier);
  const no = /^\d{1,6}$/.test(String(ev.order_no || '').trim()) ? numUz(+ev.order_no) + ' raqamli ' : '';
  const cust = cleanName(ev.customer);
  if (ev.type === 'on_way') return `${who} kuryer yoʻlga chiqdi. ${cap(no + 'buyurtma')}${cust ? ', ' + cust : ''}.`;
  if (ev.type === 'delivered') return `${who} kuryer ${no}buyurtmani topshirdi.${cust ? ' ' + cust + '.' : ''}${Number(ev.amount) > 0 ? ' ' + numUz(ev.amount) + ' soʻm.' : ''}`;
  if (ev.type === 'cancelled') return `Diqqat. ${who} kuryer ${no}buyurtmani bekor qildi.${cust ? ' ' + cust + '.' : ''}${ev.reason ? ' Sabab: ' + ev.reason + '.' : ''}${ev.comment ? ' Izoh: ' + String(ev.comment).slice(0, 140) : ''}`;
  return '';
}
function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }
function evLine(ev) {
  const who = ev.customer || (ev.order_no ? '№ ' + ev.order_no : 'buyurtma');
  if (ev.type === 'delivered') return `${ev.courier} topshirdi: ${who}${+ev.amount ? ', ' + money(ev.amount) + ' soʻm' : ''}`;
  if (ev.type === 'cancelled') return `${ev.courier} bekor qildi: ${who}${ev.reason ? ' (' + ev.reason + ')' : ''}`;
  return `${ev.courier} yoʻlga chiqdi: ${who}`;
}

/* ---------------- API: Supabase ---------------- */
class ApiError extends Error { constructor(code) { super(String(code || 'ERROR')); this.code = String(code || 'ERROR'); } }
const remote = {
  async rpc(fn, args = {}) {
    const key = IZI_CONFIG.SUPABASE_KEY;
    const headers = { 'Content-Type': 'application/json', apikey: key };
    if (key.startsWith('eyJ')) headers.Authorization = 'Bearer ' + key;
    let res;
    try {
      res = await fetch(IZI_CONFIG.SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, { method: 'POST', headers, body: JSON.stringify(args) });
    } catch (e) { throw new ApiError('NETWORK'); }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) {}
    if (!res.ok) throw new ApiError((data && (data.message || data.msg || data.error)) || 'HTTP_' + res.status);
    if (data && typeof data === 'object' && !Array.isArray(data) && data.error) throw new ApiError(data.error);
    return data;
  },
  login: (code, pass) => remote.rpc('izi_login', { p_code: code, p_pass: pass }),
  me: t => remote.rpc('izi_me', { p_token: t }),
  logout: t => remote.rpc('izi_logout', { p_token: t }),

let actx = null;
function chime(type) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const seq = { delivered: [659, 880, 1319], cancelled: [523, 392, 330], on_way: [587, 784], assigned: [784, 988] }[type] || [660, 880];
    const t0 = actx.currentTime + 0.02;
    seq.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), st = t0 + i * 0.14;
      o.type = type === 'cancelled' ? 'triangle' : 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.4, st + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.32);
      o.connect(g); g.connect(actx.destination); o.start(st); o.stop(st + 0.36);
    });
  } catch (e) {}
}
const vRank = v => /^uz/i.test(v.lang) ? 0 : /^ru/i.test(v.lang) ? 1 : /^tr/i.test(v.lang) ? 2 : 3;
/* Ovoz: faqat signal (ding) beriladi — gapiruvchi ovoz (speech) olib tashlangan. */
/* Brauzerlar ovozni faqat foydalanuvchi ekranga tekkandan keyin ruxsat beradi */
function unlockAudio() {
  if (S.audioOk) return;
  S.audioOk = true;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.resume) actx.resume();
    const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource();
    src.buffer = b; src.connect(actx.destination); src.start(0);
  } catch (e) {}
  const b = $('.banner'); if (b) b.remove();
}
function announce(evs) {
  if (!evs.length) return;
  if (evs.length > 3) toast(`${evs.length} ta yangi xabar keldi`, 'go');
  else evs.forEach(ev => toast(evLine(ev), ev.type === 'delivered' ? 'ok' : ev.type === 'cancelled' ? 'no' : 'way'));
  try { navigator.vibrate && navigator.vibrate([140, 70, 140]); } catch (e) {}
  if (!S.soundOn) return;
  chime(evs[evs.length - 1].type);
}
function notifyCourier(n) {
  toast(`Sizga ${n} ta yangi buyurtma berildi`, 'go');
  try { navigator.vibrate && navigator.vibrate([220, 100, 220]); } catch (e) {}
  if (!S.soundOn) return;
  chime('assigned');
}
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      if (!wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}

/* ---------------- toast va oynalar ---------------- */
function toast(msg, kind = '') {
  const root = $('#toasts'), el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  root.appendChild(el);
  while (root.children.length > 4) root.firstChild.remove();
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, kind === 'no' ? 5500 : 3800);
}
let sheetState = null;
function openSheet(html, opts = {}) {
  closeSheet(true);
  const root = $('#overlay');
  root.innerHTML = `<div class="backdrop" data-act="sheet-close"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(opts.label || '')}"><div class="grab"></div>${html}</section>`;
  const sheet = $('.sheet', root), bd = $('.backdrop', root);
  requestAnimationFrame(() => { bd.classList.add('show'); sheet.classList.add('show'); });
  document.body.classList.add('locked');
  sheetState = { onClose: opts.onClose };
  return sheet;
}
function closeSheet(instant) {
  if (!sheetState) return;
  const { onClose } = sheetState;
  sheetState = null;
  document.body.classList.remove('locked');
  const root = $('#overlay'), sheet = $('.sheet', root), bd = $('.backdrop', root);
  if (instant || !sheet) root.innerHTML = '';
  else { sheet.classList.remove('show'); bd.classList.remove('show'); setTimeout(() => { if (!sheetState) root.innerHTML = ''; }, 280); }
  if (onClose) onClose();
}
function ask({ title, text = '', ok = 'Ha', kind = 'go', back = 'Orqaga' }) {
  return new Promise(res => {
    let done = false;
    const fin = v => { if (!done) { done = true; res(v); } };
    const sheet = openSheet(`<h2 class="sh-title">${esc(title)}</h2>${text ? `<p class="sh-text">${esc(text)}</p>` : ''}
      <div class="btn-col"><button class="btn btn-${kind} btn-block" data-ask="1">${esc(ok)}</button><button class="btn btn-ghost btn-block" data-ask="0">${esc(back)}</button></div>`, { label: title, onClose: () => fin(false) });
    sheet.querySelectorAll('[data-ask]').forEach(b => b.addEventListener('click', () => { fin(b.dataset.ask === '1'); closeSheet(); }));
  });
}

/* flex gap qoʻllab-quvvatlanadimi? Yoʻq boʻlsa .nogap zaxira qoidalari ishlaydi. */
function checkFlexGap() {
  try {
    const t = document.createElement('div');
    t.style.cssText = 'display:flex;gap:12px;position:absolute;visibility:hidden;width:auto';
    t.appendChild(document.createElement('i'));
    t.appendChild(document.createElement('i'));
    document.body.appendChild(t);
    const ok = t.scrollWidth >= 12;
    document.body.removeChild(t);
    if (!ok) document.documentElement.classList.add('nogap');
  } catch (e) { /* tekshirib boʻlmadi: gap bor deb hisoblaymiz */ }
}

  const done = all.filter(o => o.status === 'delivered' || o.status === 'cancelled').sort((a, b) => parseTs(b.done_at) - parseTs(a.done_at));

const unreadCount = () => S.events.filter(e => parseTs(e.created_at) > S.readAt).length;
function courierStats(code) {
  const r = { active: 0, way: 0, ok: 0, okSum: 0, no: 0 };
  for (const o of S.orders.values()) {
    if (o.courier !== code) continue;
    if (o.status === 'assigned' || o.status === 'on_way') r.active++;
    if (o.status === 'on_way') r.way++;
    if (o.status === 'delivered' && isToday(o.done_at)) { r.ok++; r.okSum += +o.amount || 0; }
    if (o.status === 'cancelled' && isToday(o.done_at)) r.no++;
  }
  return r;
}
/* Berilmagan buyurtmalardan qaysilariga hozirgi qoldiq yetmaydi: shular binafsha rangda turadi
   va kuryerga berilmaydi. Qoldigʻi kiritilmagan mahsulot tekshirilmaydi. */
let SHORT = null;
function shortMap() {
  const map = new Map();
  for (const o of S.orders.values()) {
    if (o.status !== 'new' || o.stock_taken) continue;
    const miss = [];
    for (const [k, it] of needOf(o)) { const r = S.stock.get(k); if (!r || r.qty < it.q) miss.push({ n: it.n, need: it.q, have: r ? Math.max(0, r.qty) : 0 }); }
    if (miss.length) map.set(o.id, miss);
  }
  return map;
}
/* Bir nechtasini birdan berishda: eng eski buyurtmadan boshlab ayriladi (server ham shunday qiladi),
   qoldiq tugagach qolganlari berilmaydi. Oyna shuni oldindan aytadi. */
function simShort(ids) {
  const left = new Map([...S.stock].map(([k, r]) => [k, r.qty]));
  let n = 0;
  for (const o of ids.map(id => S.orders.get(+id)).filter(Boolean).sort((a, b) => a.id - b.id)) {
    if (o.status === 'delivered' || o.stock_taken) continue;
    const need = needOf(o);
    let ok = true;
    for (const [k, it] of need) if (!left.has(k) || left.get(k) < it.q) ok = false;
    if (!ok) { n++; continue; }
    for (const [k, it] of need) if (left.has(k)) left.set(k, left.get(k) - it.q);
  }
  return n;
}
const missText = miss => miss.map(m => `${m.n}: kerak ${m.need}, skladda ${m.have}`).join('; ');
function filteredOrders() {
  const q = norm(S.q), qd = S.q.replace(/\D/g, ''), keys = regionKeys();
  let list = [...S.orders.values()];
  if (S.filter === 'short') { SHORT = SHORT || shortMap(); list = list.filter(o => SHORT.has(o.id)); }
  else if (S.filter !== 'all') list = list.filter(o => o.status === S.filter);
  if (S.fCourier) list = list.filter(o => S.fCourier === '-' ? !o.courier : o.courier === S.fCourier);
  if (S.fRegion) list = list.filter(o => (detectRegion(o, keys) || '-') === S.fRegion);
  if (S.fCompany) list = list.filter(o => S.fCompany === '-' ? !o.company : o.company === S.fCompany);
  if (q) list = list.filter(o => norm([o.order_no, o.order_ids, o.specialist, o.specialist_phone, o.customer, o.phone, o.address, o.district, o.region, o.landmark, o.product, o.courier, o.company, o.note, o.amount].join(' ')).includes(q)
    || (qd.length >= 3 && String(o.phone || '').replace(/\D/g, '').includes(qd)));
  const recent = o => Math.max(parseTs(o.updated_at), parseTs(o.created_at));
  return list.sort((a, b) => S.filter === 'new' || S.filter === 'short' ? a.id - b.id : recent(b) - recent(a) || b.id - a.id);
}

function listBlock() {

      ${list.length ? `<button class="link-btn" data-act="selmode">${S.selMode ? 'Yopish' : 'Tanlab berish'}</button>` : ''}</div>
    <div class="olist">${shown.length ? shown.map(orderRow).join('') : emptyAll

async function loadArchive(reset) {
  if (!S.sess || S.archiveBusy) return;
  if (!S.archiveFrom || !S.archiveTo || S.archiveFrom > S.archiveTo) { toast('Sana oraligʻini toʻgʻri tanlang.', 'no'); return; }
  S.archiveBusy = true; if (S.tab === 'archive') render();
  try {
    const offset = reset ? 0 : S.archiveRows.length;
    const from = S.archiveQ.trim() && !S.archiveDateCustom ? '2000-01-01' : S.archiveFrom;
    const r = await api.archive(S.sess.token, from, S.archiveTo, S.archiveQ.trim(), offset);
    S.archiveRows = reset ? (r.orders || []) : S.archiveRows.concat(r.orders || []);
    S.archiveTotal = r.total || 0;
  } catch (e) { onErr(e); }
  finally { S.archiveBusy = false; if (S.tab === 'archive') render(); }
}
async function exportArchive() {
  if (!S.archiveFrom || !S.archiveTo || S.archiveFrom > S.archiveTo) { toast('Sana oraligʻini toʻgʻri tanlang.', 'no'); return; }
  const rows = []; let total = 0;
  try {
    do {
      const from = S.archiveQ.trim() && !S.archiveDateCustom ? '2000-01-01' : S.archiveFrom;
      const r = await api.archive(S.sess.token, from, S.archiveTo, S.archiveQ.trim(), rows.length);
      rows.push(...(r.orders || [])); total = r.total || 0;
      if (!(r.orders || []).length) break;
    } while (rows.length < total);
    await exportXlsx(rows, { totals: true, sheet: 'Arxiv', file: `izi-arxiv-${S.archiveFrom}-${S.archiveTo}.xlsx` });
  } catch (e) { onErr(e); }
}

function companyStats(name) {
  const r = { total: 0, fresh: 0, active: 0, ok: 0 };
  for (const o of S.orders.values()) {
    if (o.company !== name) continue;
    r.total++;
    if (o.status === 'new') r.fresh++;
    else if (o.status === 'assigned' || o.status === 'on_way') r.active++;
    else if (o.status === 'delivered' && isToday(o.done_at)) r.ok++;
  }
  return r;
}
/* kompaniya mahsulotlari: roʻyxatdagilar + skladda qoldigʻi borlar */
function coProducts(name) {
  const list = [...Companies.products(name)], seen = new Set(list.map(pkey));
  for (const r of S.stock.values()) if (pkey(r.company) === pkey(name) && !seen.has(pkey(r.product))) { list.push(r.product); seen.add(pkey(r.product)); }
  return list;
}
/* hozir kuryerlar qoʻlidagi (berilgan yoki yoʻldagi) mahsulotlar */
function onCouriers(name) {
  const m = new Map();

  return m;
}

  const load = new Map(cs.map(c => [c.code, courierStats(c.code).active]));
  const byReg = {}, unknown = [], plan = [];
  for (const o of orders) { const k = detectRegion(o, keys); if (k) (byReg[k] = byReg[k] || []).push(o); else unknown.push(o); }
  for (const [k, list] of Object.entries(byReg)) {
    const group = cs.filter(c => regionKeyOfName(c.region) === k);
    if (!group.length) { unknown.push(...list); continue; }
    list.sort((a, b) => districtKey(a).localeCompare(districtKey(b)) || a.id - b.id);
    const target = (list.length + group.reduce((s, c) => s + load.get(c.code), 0)) / group.length;
    let q = group.map(c => Math.max(0, target - load.get(c.code)));
    const qs = q.reduce((a, b) => a + b, 0) || 1;
    q = q.map(x => x * list.length / qs);
    const fl = q.map(Math.floor);
    const rest = list.length - fl.reduce((a, b) => a + b, 0);
    const order = q.map((x, i) => [x - fl[i], i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]);
    for (let j = 0; j < rest; j++) fl[order[j % order.length][1]]++;
    let pos = 0;
    group.forEach((c, i) => { const part = list.slice(pos, pos + fl[i]); pos += fl[i]; if (part.length) plan.push({ code: c.code, orders: part }); });
  }
  return { plan, unknown };
}

function loadXLSX() {

  if (!XLSXP) XLSXP = new Promise((res, rej) => {

function headerScore(h, f) {
  const n = norm(h); if (!n) return 0;
  let best = 0;
  for (const s0 of f.syn) {
    const s = norm(s0); if (!s) continue;
    if (n === s) best = Math.max(best, 100);
    else if (s.length >= 3 && n.startsWith(s + ' ')) best = Math.max(best, 75);
    else if (s.length >= 2 && (' ' + n + ' ').includes(' ' + s + ' ')) best = Math.max(best, 60);
    else if (s.length >= 4 && n.includes(s)) best = Math.max(best, 40);
  }
  return best;
}

function detectProducts(prev) {

    const name = String(h || '').trim(), k = norm(name);
    if (!name || !k || used.has(ci) || ROWNUM_HEAD.test(k)) return;

      const vals = IMP.data.map(r => r[ci]).filter(v => v !== '');

      const ints = vals.every(v => /^\d{1,3}([.,]0+)?(\s*(ta|dona|dn|шт|sht|та|дона)\.?)?$/i.test(String(v).trim()));
      const counter = vals.length > 2 && vals.every((v, i) => parseQty(v) === i + 1);
      isProd = vals.length > 0 && ints && !counter;

}

function takeEvents(list, initial) {
  const fresh = [], thr = initial ? S.notifiedAt : S.notifiedAt - 120000;
  for (const ev of (list || []).slice().sort((a, b) => a.id - b.id)) {
    if (S.seenEv.has(ev.id)) continue;
    S.seenEv.add(ev.id);
    S.events.push(ev);
    if (parseTs(ev.created_at) > thr) fresh.push(ev);
  }
  S.events.sort((a, b) => b.id - a.id);
  if (S.events.length > 300) S.events.length = 300;
  if (fresh.length) { S.notifiedAt = Math.max(S.notifiedAt, ...fresh.map(e => parseTs(e.created_at))); store.set('izi_notified_at', S.notifiedAt); }
  if (S.tab === 'alerts') markRead();
  return fresh;
}
function markRead() {
  const top = S.events[0];
  if (top && parseTs(top.created_at) > S.readAt) { S.readAt = parseTs(top.created_at); store.set('izi_read_at', S.readAt); }
}
function mergeOrders(list) {
  let ch = false;
  for (const o of list || []) {
    const p = S.orders.get(o.id);
    if (p && parseTs(p.updated_at) >= parseTs(o.updated_at)) continue;
    S.orders.set(o.id, o); ch = true;
  }
  return ch;
}
/* sklad qoldiqlari serverdan keladi: kuryer bekor qilsa ham admin ekranida darhol yangilanadi */
const stockSig = () => [...S.stock.values()].map(r => stockKey(r.company, r.product) + '=' + r.qty).sort().join('|');
function setStock(rows) {
  if (!Array.isArray(rows)) return false;
  const before = stockSig();
  S.stock = new Map(rows.map(r => [stockKey(r.company, r.product), { company: r.company, product: r.product, qty: +r.qty || 0 }]));
  /* boshqa qurilmada qoʻshilgan mahsulot va kompaniyalar bu yerda ham koʻrinsin */
  for (const r of S.stock.values()) {
    let c = Companies.list().find(x => pkey(x.name) === pkey(r.company));
    if (!c) { Companies.add(r.company); c = Companies.list().find(x => pkey(x.name) === pkey(r.company)); }
    if (c && !Companies.products(c.name).some(p => pkey(p) === pkey(r.product))) Companies.addProducts(c.name, [r.product]);
  }
  return before !== stockSig();
}
async function adminFull() {
  const initial = !S.loadedOnce;
  const r = await api.adminLoad(S.sess.token, S.days);
  lastFull = Date.now();
  const st = parseTs(r.server_time) || Date.now();
  if (!S.notifiedAt) { S.notifiedAt = st; store.set('izi_notified_at', st); }
  if (!S.readAt) { S.readAt = st; store.set('izi_read_at', st); }
  const before = S.loadedOnce ? sigOf(S.orders) + '|' + S.users.map(u => u.code + u.active).join(',') + '|' + stockSig() : null;
  S.orders = new Map((r.orders || []).map(o => [o.id, o]));
  S.users = r.users || [];
  setStock(r.stock);
  S.since = r.next_since;
  for (const id of [...S.sel]) if (!S.orders.has(id)) S.sel.delete(id);
  const fresh = takeEvents(r.events, initial);
  S.loadedOnce = true;
  const after = sigOf(S.orders) + '|' + S.users.map(u => u.code + u.active).join(',') + '|' + stockSig();
  if (before === null || before !== after || fresh.length) render();
  if (fresh.length) announce(fresh);
}
async function adminChanges() {
  const r = await api.adminChanges(S.sess.token, S.since);
  S.since = r.next_since;
  const ch = mergeOrders(r.orders) | setStock(r.stock);
  const fresh = takeEvents(r.events, false);
  if (ch || fresh.length) {
    if (S.tab === 'orders' && document.activeElement && document.activeElement.id === 'q') renderList();
    else render();
  }
  if (fresh.length) announce(fresh);
}
const sigOf = m => [...m.values()].map(o => `${o.id}:${o.status}:${o.updated_at}:${o.courier}`).sort().join('|');
async function courierTick(first) {
  const r = await api.myOrders(S.sess.token);
  const prev = S.orders, next = new Map();
  let fresh = 0;
  for (const o of r.orders || []) {
    const p = prev.get(o.id);
    if (p && parseTs(p.updated_at) > parseTs(o.updated_at)) { next.set(o.id, p); continue; }
    next.set(o.id, o);
    if (!first && o.status === 'assigned' && (!p || p.status !== 'assigned')) fresh++;
  }
  const changed = first || sigOf(prev) !== sigOf(next);
  S.orders = next;
  if (changed) render();
  if (fresh) notifyCourier(fresh);
}
async function refreshAdmin() { try { await adminChanges(); setOnline(true); } catch (e) { onErr(e, true); } }

/* ---------------- sessiya ---------------- */
async function startSession() {
  stopPolling();
  Object.assign(S, { orders: new Map(), events: [], seenEv: new Set(), since: null, loadedOnce: false, tab: 'orders', filter: 'new', q: '', fRegion: '', fCourier: '', fCompany: '', selMode: false, ctab: 'active', landed: null });
  S.sel.clear();
  render();
  try {
    if (S.sess.role === 'admin') {
      S.notifiedAt = store.get('izi_notified_at', 0) || 0;
      S.readAt = store.get('izi_read_at', 0) || 0;
      await adminFull();
      if (S.wake) keepAwake(true);
    } else await courierTick(true);
    setOnline(true);
  } catch (e) { onErr(e, true); }
  schedule();
}
async function doLogin(code, pass) {
  const err = $('#lg-err'), btn = $('#lg-btn');
  code = normCode(code);
  if (!code || !pass) { if (err) err.textContent = 'Login va parolni kiriting.'; return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Tekshirilmoqda…'; }
  try {
    const r = await api.login(code, pass);
    S.sess = { token: r.token, code: r.code, role: r.role, region: r.region, zone: r.zone || 'main' };
    store.set('izi_sess', S.sess);
    await startSession();
  } catch (e) {
    if (err) err.textContent = errText(e); else toast(errText(e), 'no');
    if (btn) { btn.disabled = false; btn.textContent = 'Kirish'; }
  }
}
function logout() {
  stopPolling();
  const t = S.sess && S.sess.token;
  S.sess = null;
  store.del('izi_sess');
  Object.assign(S, { orders: new Map(), events: [], users: [], loadedOnce: false });
  keepAwake(false);
  closeSheet(true);
  render();
  if (t) api.logout(t).catch(() => {});
}
function onErr(e, quiet) {
  const c = (e && e.code) || String(e || '');
  if (c.includes('NO_SESSION')) { toast(errText(e), 'no'); logout(); return; }
  if (c === 'NETWORK') { setOnline(false); if (!quiet) toast(errText(e), 'no'); return; }
  if (!quiet) toast(errText(e), 'no');
  else if (window.console) console.warn('IZI:', c);
}

/* ---------------- kuryer amallari ---------------- */
async function courierSet(id, status, reason = null, note = '') {
  if (S.busy.has(id)) return;
  S.busy.add(id); render();
  try {
    const o = await api.setStatus(S.sess.token, id, status, reason, note || null);
    S.orders.set(o.id, o);
    if (status !== 'on_way') {
      S.landed = o.id; S.landFresh = true;
      clearTimeout(S.landT);
      S.landT = setTimeout(() => { S.landed = null; render(); }, 1800);
    }
    toast(status === 'on_way' ? 'Yoʻlga chiqdingiz. Admin xabardor.' : status === 'delivered' ? 'Topshirildi. Admin xabardor.' : 'Bekor qilindi. Admin xabardor.',
      status === 'on_way' ? 'way' : status === 'delivered' ? 'ok' : 'no');
    try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
  } catch (e) { onErr(e); }
  finally { S.busy.delete(id); render(); }
}
async function runAssign(ids, code) {
  if (!ids.length) return;
  closeSheet();
  try {
    const r = await api.assign(S.sess.token, ids, code || null);
    const msg = code ? `${r.updated} ta buyurtma ${code} kuryerga berildi` : `${r.updated} ta buyurtma kuryerdan qaytarib olindi`;
    if (r.short) toast(r.updated ? `${msg}. ${r.short} tasiga mahsulot yetmadi, ular berilmadi.` : 'Skladda mahsulot yetarli emas, buyurtma kuryerga berilmadi. Avval kirim qiling.', 'no');
    else toast(msg, 'go');
    S.selMode = false; S.sel.clear();
    await refreshAdmin();
    render();
  } catch (e) { onErr(e); }
}
async function runAuto() {
  const plan = S.autoPlan || [];
  closeSheet();
  let n = 0;
  try {
    let sh = 0;
    for (const p of plan) { const r = await api.assign(S.sess.token, p.orders.map(o => o.id), p.code); n += r.updated; sh += r.short || 0; }
    toast(`Taqsimlandi: ${n} ta buyurtma${sh ? `. ${sh} tasiga mahsulot yetmadi` : ''}`, sh ? 'no' : 'ok');
    S.selMode = false; S.sel.clear(); S.filter = 'assigned';
  } catch (e) { onErr(e); }
  await refreshAdmin();
  render();
}
async function deleteIds(ids) {
  if (!ids.length) return;
  if (!(await ask({ title: ids.length > 1 ? `${ids.length} ta buyurtma oʻchirilsinmi?` : 'Buyurtma oʻchirilsinmi?', text: 'Buyurtma va uning tarixi butunlay oʻchadi.', ok: 'Oʻchirish', kind: 'no-solid' }))) return;
  try {
    const r = await api.deleteOrders(S.sess.token, ids);
    ids.forEach(id => { S.orders.delete(id); S.sel.delete(id); });
    if (!S.sel.size) S.selMode = false;
    await refreshAdmin();   /* skladga qaytgan tovar darhol koʻrinsin */
    render();
    toast(`${r.deleted} ta buyurtma oʻchirildi`);
  } catch (e) { onErr(e); }
}
async function saveUser() {
  const err = $('#uf-err');
  const code = $('#uf-code') ? $('#uf-code').value : S.editUser;
  const region = $('#uf-region') ? $('#uf-region').value : null;
  const pass = ($('#uf-pass') || {}).value || '';
  const active = $('#uf-active') ? $('#uf-active').checked : null;
  if (!normCode(code)) { if (err) err.textContent = 'Loginni kiriting.'; return; }
  try {
    const r = await api.userSave(S.sess.token, code, region, pass.trim() || null, active);
    if (r && r.users) S.users = r.users;
    closeSheet();
    toast('Saqlandi', 'ok');
    render();
  } catch (e) { if (err) err.textContent = errText(e); }
}
function setTab(v) {
  if (v === 'archive') loadArchive(true);
  S.tab = v; S.selMode = false; S.sel.clear();
  if (v === 'alerts') { S.hlFrom = S.readAt; markRead(); }
  render();
  window.scrollTo(0, 0);
}

/* ---------------- hodisalar ---------------- */
const ACT = {
  'demo-login': el => { closeSheet(true); doLogin(el.dataset.code, 'demo'); },
  'demo-switch': () => openDemoSwitch(),
  'demo-reset': async () => {
    if (!(await ask({ title: 'Barcha maʼlumotlar tozalansinmi?', text: 'Shu brauzerdagi barcha buyurtma va xabarlar oʻchadi, kuryerlar roʻyxati boshlangʻich holatiga qaytadi. Kompaniyalar va ularning mahsulotlari saqlanib qoladi.', ok: 'Tozalash', kind: 'no-solid' }))) return;
    demo.reset(); store.del('izi_notified_at'); store.del('izi_read_at'); logout();
  },
  'co-excel': el => { S.impCompany = el.dataset.co; const f = $('#fileIn'); f.value = ''; f.click(); },
  'co-manual': el => openManual(el.dataset.co),
  'co-template': el => downloadTemplate(el.dataset.co),
  'co-prod': el => openProducts(el.dataset.co),
  'co-add': () => openCoAdd(),
  'co-del': el => removeCompany(el.dataset.co),
  'co-orders': el => { Object.assign(S, { fCompany: el.dataset.co, fRegion: '', fCourier: '', q: '', filter: 'all' }); setTab('orders'); },
  'prod-toggle': el => { const p = IMP && IMP.prods[+el.dataset.i]; if (!p) return; p.on = !p.on; updateImportPreview(); },
  'q-inc': el => { const i = $('#mq-' + el.dataset.i); if (i) i.value = String(Math.min(999, parseQty(i.value) + 1)); },
  'q-dec': el => { const i = $('#mq-' + el.dataset.i); if (i) { const n = parseQty(i.value) - 1; i.value = n > 0 ? String(n) : ''; } },
  'manual-again': () => saveManual(true),
  logout: async () => { if (await ask({ title: 'Ilovadan chiqasizmi?', ok: 'Chiqish', kind: 'no-solid' })) logout(); },
  sound: () => {
    S.soundOn = !S.soundOn; store.set('izi_sound', S.soundOn);
    if (S.soundOn) { unlockAudio(); chime('assigned'); }
    render();
    toast(S.soundOn ? 'Signal yoqildi' : 'Signal oʻchirildi');
  },
  unlock: () => { unlockAudio(); chime('on_way'); render(); },
  theme: el => setTheme(el.dataset.v),
  'sound-test': () => { unlockAudio(); chime('delivered'); },
  'report-today': () => reportToday(),
  'archive-search': () => loadArchive(true),
  'archive-more': () => loadArchive(false),
  'archive-export': () => exportArchive(),
  'archive-open': el => { const o = S.archiveRows.find(x => x.id === +el.dataset.id); if (o) { S.orders.set(o.id, o); openOrder(o.id); } },
  tab: el => setTab(el.dataset.v),
  filter: el => { S.filter = el.dataset.v; S.limit = 200; S.selMode = false; S.sel.clear(); render(); },
  ctab: el => { S.ctab = el.dataset.v; render(); },
  selmode: () => { S.selMode = !S.selMode; S.sel.clear(); renderList(); },
  selall: () => {
    const shown = filteredOrders().slice(0, S.limit);
    if (S.sel.size >= shown.length) S.sel.clear(); else shown.forEach(o => S.sel.add(o.id));
    renderList();
  },
  selclear: () => { S.sel.clear(); S.selMode = false; renderList(); },
  sel: el => { const id = +el.dataset.id; if (S.sel.has(id)) S.sel.delete(id); else S.sel.add(id); renderList(); },
  open: el => openOrder(+el.dataset.id),
  more: () => { S.limit += 200; renderList(); },
  import: () => setTab('companies'),
  export: () => exportXlsx(filteredOrders()),
  auto: () => openAuto(),
  'auto-go': () => runAuto(),
  'assign-sel': () => openAssign([...S.sel]),
  'assign-many': el => runAssign(S.assignIds || [], el.dataset.code || null),
  'assign-one': el => runAssign([+el.dataset.id], el.dataset.code),
  unassign: el => runAssign([+el.dataset.id], null),
  'del-one': el => deleteIds([+el.dataset.id]),
  'del-sel': () => deleteIds([...(S.assignIds || [])]),
  'courier-orders': el => { S.fCourier = el.dataset.code; S.fRegion = ''; S.q = ''; S.filter = 'all'; setTab('orders'); },
  'user-edit': el => openUser(el.dataset.code),
  'user-new': () => openUser(null),
  'st-way': el => courierSet(+el.dataset.id, 'on_way'),
  'st-ok': el => openDeliver(+el.dataset.id),
  'st-no': el => openCancel(+el.dataset.id),
  'do-ok': el => { const note = ($('#dl-note') || {}).value || ''; closeSheet(); courierSet(+el.dataset.id, 'delivered', null, note.trim()); },
  'do-no': el => {
    const r = document.querySelector('input[name=rs]:checked'), note = (($('#cn-note') || {}).value || '').trim();
    if (note.length < 2) { const e = $('#cn-err'); if (e) e.textContent = 'Izoh yozing: admin nima boʻlganini bilishi kerak.'; const t = $('#cn-note'); if (t) t.focus(); return; }
    closeSheet();
    courierSet(+el.dataset.id, 'cancelled', r ? r.value : REASONS[0], note);
  },
  'sheet-close': () => closeSheet(),
  'ph-pick': el => {
    const i = +el.dataset.i, box = el.closest('.phones');
    S.phSel.set(+el.dataset.id, i);
    box.querySelectorAll('.ph').forEach((b, j) => b.setAttribute('aria-checked', String(j === i)));
    const old = box.querySelector('.btn-call');
    if (old) old.outerHTML = callBtn(el.dataset.tel);
  },
  'ph-need': () => toast('Avval qaysi raqamga qoʻngʻiroq qilishni tanlang.', 'no'),
  'stk-in': el => openStockEdit(el.dataset.i, 'add'),
  'stk-edit': el => openStockEdit(el.dataset.i, 'set'),
  'stk-del': () => deleteProduct(),
  'import-go': () => runImport(),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; S.limit = 200; renderList(); }
  if (e.target.id === 'mf-addr') updateRegHint();
  if (e.target.closest && e.target.closest('#manualForm')) { const er = $('#mf-err'); if (er && er.textContent) er.textContent = ''; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'archiveFrom') { S.archiveFrom = t.value; S.archiveDateCustom = true; }
  else if (t.id === 'archiveTo') { S.archiveTo = t.value; S.archiveDateCustom = true; }
  else if (t.id === 'archiveQ') S.archiveQ = t.value;
  else if (t.id === 'fRegion') { S.fRegion = t.value; renderList(); }
  else if (t.id === 'fCourier') { S.fCourier = t.value; renderList(); }
  else if (t.id === 'fCompany') { S.fCompany = t.value; renderList(); }
  else if (t.id === 'setSound') { S.soundOn = t.checked; store.set('izi_sound', S.soundOn); if (S.soundOn) unlockAudio(); render(); }
  else if (t.id === 'setWake') { S.wake = t.checked; store.set('izi_wake', S.wake); keepAwake(S.wake); }
  else if (t.id === 'setDays') { S.days = +t.value; store.set('izi_days', S.days); adminFull().catch(err => onErr(err)); }
  else if (t.dataset && t.dataset.map) { IMP.map[t.dataset.map] = t.value === '' ? null : +t.value; store.set('izi_map:' + sigHeaders(IMP.headers), IMP.map); updateImportPreview(); }
  else if (t.id === 'impSheet') { IMP.sheet = t.value; prepSheet(); openImport(); }
  else if (t.name === 'rs') {
    const ta = $('#cn-note'); if (ta) ta.placeholder = REASON_HINT[t.value] || '';
    document.querySelectorAll('.reason').forEach(l => l.classList.toggle('on', !!l.querySelector('input:checked')));
  }
  else if (t.id === 'fileIn') { const f = t.files && t.files[0]; if (f) readExcel(f); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'loginForm') { e.preventDefault(); doLogin($('#lg-code').value, $('#lg-pass').value); }
  else if (e.target.id === 'userForm') { e.preventDefault(); saveUser(); }
  else if (e.target.id === 'manualForm') { e.preventDefault(); saveManual(false); }
  else if (e.target.id === 'prodForm') { e.preventDefault(); addProduct(); }
  else if (e.target.id === 'stkForm') { e.preventDefault(); saveStock(); }
  else if (e.target.id === 'coForm') { e.preventDefault(); saveCompany(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'archiveQ') { e.preventDefault(); loadArchive(true); }
  if (e.key === 'Escape' && sheetState) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.orow[tabindex]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('pointerdown', unlockAudio, true);
document.addEventListener('keydown', unlockAudio, true);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !S.sess) return;
  if (S.sess.role === 'admin' && S.wake) keepAwake(true);
  clearTimeout(pollT); tick();
});
window.addEventListener('online', () => { if (S.sess) { clearTimeout(pollT); tick(); } });

/* ---------------- ishga tushirish ---------------- */
applyTheme();
checkFlexGap();
render();
if (S.sess) {
  (async () => {
    try { const me = await api.me(S.sess.token); Object.assign(S.sess, me); store.set('izi_sess', S.sess); }
    catch (e) { if (e.code !== 'NETWORK') { logout(); return; } S.online = false; }
    startSession();
  })();
}
window.IZI = { S, api, numUz, spellCode, normPhone, parseAmount, detectRegion, regionKeyOfName, regionKeyOf, regionOfText, zoneOfOrder, normCode, headerScore, FIELDS, planAuto, Companies, parseQty, itemLines, reportToday, itemsOf, shortMap, simShort };
})();
